services:
  postgres:
    image: postgres:17-alpine@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
    environment:
      POSTGRES_DB: superlily
      POSTGRES_USER: superlily
      POSTGRES_PASSWORD: ${SUPERLILY_POSTGRES_PASSWORD:?set SUPERLILY_POSTGRES_PASSWORD}
    volumes:
      - superlily_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superlily -d superlily"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [core]

  lily-core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SUPERLILY_DATABASE_URL: postgresql+asyncpg://superlily:${SUPERLILY_POSTGRES_PASSWORD}@postgres:5432/superlily
      SUPERLILY_ADMIN_TOKEN: ${SUPERLILY_ADMIN_TOKEN:?set SUPERLILY_ADMIN_TOKEN}
      SUPERLILY_INGEST_TOKENS_JSON: ${SUPERLILY_INGEST_TOKENS_JSON:?set SUPERLILY_INGEST_TOKENS_JSON}
      SUPERLILY_PROVIDER_TOKENS_JSON: ${SUPERLILY_PROVIDER_TOKENS_JSON:-{}}
      SUPERLILY_STALE_AFTER_SECONDS: ${SUPERLILY_STALE_AFTER_SECONDS:-90}
      SUPERLILY_CORRELATION_WINDOW_SECONDS: ${SUPERLILY_CORRELATION_WINDOW_SECONDS:-2}
      SUPERLILY_RAW_ENABLED: ${SUPERLILY_RAW_ENABLED:-false}
      SUPERLILY_RAW_MAX_BYTES: ${SUPERLILY_RAW_MAX_BYTES:-32768}
      SUPERLILY_COMMAND_REGISTRY_PATH: ${SUPERLILY_COMMAND_REGISTRY_PATH:-apps/core/config/command_registry.toml}
      SUPERLILY_COMMAND_REGISTRY_SNAPSHOT_STALE_SECONDS: ${SUPERLILY_COMMAND_REGISTRY_SNAPSHOT_STALE_SECONDS:-600}
      SUPERLILY_PROVIDER_INVENTORY_STALE_SECONDS: ${SUPERLILY_PROVIDER_INVENTORY_STALE_SECONDS:-600}
      SUPERLILY_PROVIDER_HEARTBEAT_STALE_SECONDS: ${SUPERLILY_PROVIDER_HEARTBEAT_STALE_SECONDS:-90}
      SUPERLILY_TOOL_EXECUTION_MODE: ${SUPERLILY_TOOL_EXECUTION_MODE:-off}
      SUPERLILY_TOOL_GLOBAL_STOP: ${SUPERLILY_TOOL_GLOBAL_STOP:-false}
      SUPERLILY_TOOL_CANARY_SCOPES_JSON: ${SUPERLILY_TOOL_CANARY_SCOPES_JSON:-[]}
      SUPERLILY_TOOL_ENFORCE_SCOPES_JSON: ${SUPERLILY_TOOL_ENFORCE_SCOPES_JSON:-[]}
      SUPERLILY_TOOL_LEASE_SECONDS: ${SUPERLILY_TOOL_LEASE_SECONDS:-15}
      SUPERLILY_TOOL_REAPER_INTERVAL_SECONDS: ${SUPERLILY_TOOL_REAPER_INTERVAL_SECONDS:-1}
      SUPERLILY_CONTROL_OPERATORS_JSON: ${SUPERLILY_CONTROL_OPERATORS_JSON:-}
      SUPERLILY_CONTROL_ALLOWED_HOSTS_JSON: ${SUPERLILY_CONTROL_ALLOWED_HOSTS_JSON:-[]}
      SUPERLILY_CONTROL_ALLOWED_ORIGINS_JSON: ${SUPERLILY_CONTROL_ALLOWED_ORIGINS_JSON:-[]}
      SUPERLILY_CONTROL_AUDIT_PEPPER: ${SUPERLILY_CONTROL_AUDIT_PEPPER:-}
      SUPERLILY_CONTROL_SESSION_SECONDS: ${SUPERLILY_CONTROL_SESSION_SECONDS:-900}
      SUPERLILY_CONTROL_REAUTH_SECONDS: ${SUPERLILY_CONTROL_REAUTH_SECONDS:-300}
      SUPERLILY_CONTROL_LOGIN_ATTEMPTS: ${SUPERLILY_CONTROL_LOGIN_ATTEMPTS:-5}
      SUPERLILY_CONTROL_LOGIN_WINDOW_SECONDS: ${SUPERLILY_CONTROL_LOGIN_WINDOW_SECONDS:-300}
      SUPERLILY_CONTROL_PREVIEW_SECONDS: ${SUPERLILY_CONTROL_PREVIEW_SECONDS:-60}
      SUPERLILY_CONTROL_MUTATION_ATTEMPTS: ${SUPERLILY_CONTROL_MUTATION_ATTEMPTS:-10}
      SUPERLILY_CONTROL_MUTATION_WINDOW_SECONDS: ${SUPERLILY_CONTROL_MUTATION_WINDOW_SECONDS:-60}
      SUPERLILY_GROUP_DEFAULT_MODE: ${SUPERLILY_GROUP_DEFAULT_MODE:-command_only}
      SUPERLILY_GROUP_MODES_JSON: ${SUPERLILY_GROUP_MODES_JSON:-{}}
      SUPERLILY_CLAIM_MODE: ${SUPERLILY_CLAIM_MODE:-off}
      SUPERLILY_CLAIM_CANARY_CONVERSATIONS_JSON: ${SUPERLILY_CLAIM_CANARY_CONVERSATIONS_JSON:-[]}
      SUPERLILY_CLAIM_MINIMUM_CONFIDENCE: ${SUPERLILY_CLAIM_MINIMUM_CONFIDENCE:-85}
      SUPERLILY_CLAIM_REQUIRED_OBSERVATIONS: ${SUPERLILY_CLAIM_REQUIRED_OBSERVATIONS:-2}
      SUPERLILY_CLAIM_COALESCE_MILLISECONDS: ${SUPERLILY_CLAIM_COALESCE_MILLISECONDS:-200}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn superlily_core.app:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SUPERLILY_PORT:-8765}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      core: {}
      bus:
        aliases: [lily-core]

  status-provider:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SUPERLILY_STATUS_PROVIDER_CORE_URL: http://lily-core:8000
      SUPERLILY_STATUS_PROVIDER_TOKEN: ${SUPERLILY_STATUS_PROVIDER_TOKEN:?set SUPERLILY_STATUS_PROVIDER_TOKEN}
      SUPERLILY_STATUS_PROVIDER_DESCRIPTOR_PATH: registry/descriptors/status.inspect/1.0.1.json
      SUPERLILY_STATUS_PROVIDER_HEARTBEAT_SECONDS: ${SUPERLILY_STATUS_PROVIDER_HEARTBEAT_SECONDS:-30}
      SUPERLILY_STATUS_PROVIDER_INVENTORY_SECONDS: ${SUPERLILY_STATUS_PROVIDER_INVENTORY_SECONDS:-300}
      SUPERLILY_STATUS_PROVIDER_TIMEOUT_SECONDS: ${SUPERLILY_STATUS_PROVIDER_TIMEOUT_SECONDS:-5}
      SUPERLILY_STATUS_PROVIDER_POLL_SECONDS: ${SUPERLILY_STATUS_PROVIDER_POLL_SECONDS:-0.25}
      SUPERLILY_STATUS_PROVIDER_MAX_IDLE_POLL_SECONDS: ${SUPERLILY_STATUS_PROVIDER_MAX_IDLE_POLL_SECONDS:-5}
      SUPERLILY_STATUS_PROVIDER_EXECUTION_HEARTBEAT_SECONDS: ${SUPERLILY_STATUS_PROVIDER_EXECUTION_HEARTBEAT_SECONDS:-1}
    command: ["superlily-status-provider", "serve"]
    depends_on:
      lily-core:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [bus]

volumes:
  superlily_postgres_data:

networks:
  core:
  bus:
    name: superlily_bus
