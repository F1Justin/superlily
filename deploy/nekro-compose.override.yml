services:
  nekro_agent:
    image: superlily/nekro-agent:2.3.3-superlily.16-deepseek-search.3
    build:
      context: /home/justin/SuperLily-Nekro-Runtime
      dockerfile: /home/justin/SuperLily-Nekro-Runtime/docker/deepseek-search.Dockerfile
      args:
        VCS_REF: de5fbaae012c4a4a1c431b0ae8b9dcaa1e8f9a73
    networks:
    - nekro_network
    - superlily_bus
    environment:
      NEKRO_EGRESS_PROXY: http://172.20.0.1:7898
      NEKRO_EGRESS_CONTROL_URL: http://172.20.0.1:7900
      NEKRO_EGRESS_CONTROL_TOKEN: ${NEKRO_EGRESS_CONTROL_TOKEN}
  nekro_napcat:
    image: mlikiowa/napcat-docker:v4.18.28@sha256:2cc70b45244ae3fabc657ffc3aaa4de8fb893518171e519659ab83d80e6d36b5
networks:
  superlily_bus:
    external: true
