# Use with /home/justin/nekro/docker-compose.yml after `superlily_bus` exists.
# Runtime source and release identity are pinned in nekro-runtime.lock.yml.
services:
  nekro_agent:
    image: superlily/nekro-agent:2.3.3-superlily.12-qq-voice.5
    build:
      context: /home/justin/SuperLily-Nekro-Runtime
      dockerfile: /home/justin/superlily/deploy/Dockerfile.nekro-qq-voice
    networks:
      - nekro_network
      - superlily_bus

  nekro_napcat:
    image: mlikiowa/napcat-docker:v4.18.28@sha256:2cc70b45244ae3fabc657ffc3aaa4de8fb893518171e519659ab83d80e6d36b5

networks:
  superlily_bus:
    external: true
