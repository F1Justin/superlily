[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "superlily"
version = "0.2.0"
description = "Lily Core observability spine and bridge contracts"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.26,<5",
  "pydantic>=2.10,<3",
  "rfc8785>=0.1.4,<0.2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
superlily-tool-registry = "superlily_contracts.tool_registry_cli:main"
superlily-tool-registry-admin = "superlily_core.tool_registry_admin:main"
superlily-status-provider = "superlily_status_provider.main:main"
superlily-wolfram-provider = "superlily_wolfram_provider.main:main"
superlily-latex-provider = "superlily_latex_provider.main:main"
superlily-latex-worker = "superlily_latex_provider.worker:main"
superlily-control-password = "superlily_core.control_plane_cli:main"
superlily-phase3-status-fault = "superlily_core.phase3_status_fault_driver:main"

[tool.setuptools]
packages = ["superlily_core", "superlily_contracts", "superlily_provider_sdk", "superlily_status_provider", "superlily_wolfram_provider", "superlily_latex_provider"]
package-dir = {superlily_core = "apps/core/src/superlily_core", superlily_contracts = "packages/contracts/src/superlily_contracts", superlily_provider_sdk = "packages/provider_sdk/src/superlily_provider_sdk", superlily_status_provider = "apps/status_provider/src/superlily_status_provider", superlily_wolfram_provider = "apps/wolfram_provider/src/superlily_wolfram_provider", superlily_latex_provider = "apps/latex_provider/src/superlily_latex_provider"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "apps/core/src",
  "apps/status_provider/src",
  "apps/wolfram_provider/src",
  "apps/latex_provider/src",
  "packages/contracts/src",
  "packages/provider_sdk/src",
]
