[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "superlily"
version = "0.2.0"
description = "Lily Core observability spine and bridge contracts"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.26,<5",
  "pydantic>=2.10,<3",
  "rfc8785>=0.1.4,<0.2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
superlily-tool-registry = "superlily_contracts.tool_registry_cli:main"

[tool.setuptools]
packages = ["superlily_core", "superlily_contracts"]
package-dir = {superlily_core = "apps/core/src/superlily_core", superlily_contracts = "packages/contracts/src/superlily_contracts"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
